name: Assess Documentation

on: push

jobs:
  readme-linting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: 'test/docs'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.9
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install vale crudini
      - name: Create Vale configuration file
        run: |
          # Initialize the .vale.ini file and set general configurations
          crudini --set .vale.ini '' StylesPath .github/styles
          crudini --set .vale.ini '' MinAlertLevel warning

          # Add other packages
          crudini --set .vale.ini '' Packages Microsoft

          # Add the section for Markdown files and specify the custom style
          crudini --set .vale.ini '*.md' BasedOnStyles 'docs, Microsoft'
          # crudini --set .vale.ini '*.md' Microsoft.HeadingAcronyms warning
          cat .vale.ini
      - name: Check whether general README exists
        run: |
          if [ ! -f README.md ]; then
            echo "README.md file is missing"
            exit 1
          fi
      - name: Check whether docs exists and contains a real README
        run: |
          if [ -d "./docs" ]; then
            echo "Folder exists."
            if [ ! -f "./docs/readme.md" ]; then
              echo "docs/readme.md file is missing"
              exit 1
            fi
          else
            echo "Folder 'docs' does not exist."
            exit 1
          fi
      - name: Run Vale and Capture Output
        run: |
          # Download and install packages
          vale sync
          # Execute
          vale --output=JSON docs/*.md > vale-report.json || true

      - name: Debug results
        run: |
          ls -la
          cat vale-report.json

